<!-- #region head -->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>THE MET</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com">
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous">
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital@0;1&display=swap"
      rel="stylesheet">
    <link
      rel="icon"
      href="src/images/logo.png">
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- endregion -->

  <body class="page__body">
    <!-- #region header -->
    <header class="header">
      <div class="header__top top-bar">
        <a href="#" class="home-link">
          <img
            src="src/images/logo.png"
            alt="The Met logo"
            class="logo">
        </a>

        <div class="icons">
          <a href="tel:+1 212-535-7710" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu-button">
            <span class="menu-button-line"></span>
          </a>
        </div>
      </div>

      <div class="header__cover">
        <h1 class="header__title">Welcome
          <br>
          to The MET
        </h1>
      </div>
    </header>

    <aside class="menu page__menu" id="menu">
      <div class="menu__top top-bar">
        <a href="#" class="home-link">
          <img
            src="src/images/logo.png"
            alt="The Met logo"
            class="logo">
        </a>

        <div class="icons">
          <a href="#" class="icon icon--close"></a>
        </div>
      </div>

      <div class="menu__main">
        <nav class="menu__nav">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#" class="menu__link">Home</a>
            </li>
            <li class="menu__item">
              <a href="#working-hours" class="menu__link">About Us</a>
            </li>
            <li class="menu__item">
              <a href="#on-view" class="menu__link">Now on view</a>
            </li>
            <li class="menu__item">
              <a href="#explore-online" class="menu__link">Explore Online</a>
            </li>
            <li class="menu__item">
              <a href="#contact-us" class="menu__link">Contacts</a>
            </li>
          </ul>
        </nav>

        <div class="menu__contacts">
          <div class="menu__tel-block">
            <div>
              <p class="menu__tel-title">The Met Fifth Avenue</p>
              <a class="menu__tel" href="tel:+1 212-535-7710">+1 212-535-7710</a>
            </div>
            <div>
              <p class="menu__tel-title">The Met Cloisters</p>
              <a class="menu__tel" href="tel:+1 212-923-3700">+1 212-923-3700</a>
            </div>
          </div>
          <div>
            <a class="menu__call-to-order" href="#">call to order</a>
          </div>
        </div>
      </div>
    </aside>
    <!-- endregion -->

    <!-- #region main -->
    <main class="main">
      <section class="section working-hours" id="working-hours"></section>
      <section class="section on-view" id="on-view"></section>
      <section class="section explore-online" id="explore-online"></section>
      <section class="section contact-us" id="contact-us"></section>
    </main>
    <!-- endregion -->

    <!-- #region footer -->
    <footer class="footer">

    </footer>
    <!-- endregion -->
  </body>
</html>
